[project]
name = "cfb-api"
version = "0.0.0"
description = "FastAPI service: one endpoint per screen. Depends on the db package only, never engine[train]"
requires-python = ">=3.13,<3.14"
dependencies = ["cfb-db", "fastapi>=0.118"]

[tool.uv.sources]
cfb-db = { workspace = true }

[tool.vercel]
entrypoint = "src.api.main:app"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"
