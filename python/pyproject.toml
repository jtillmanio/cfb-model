# uv workspace root. `uv run` from here syncs every member plus the dev tools.
# [project] lists only what the API needs: Vercel installs the API from this lock with --no-dev,
# and every deployment stores its own copy (D-126). api/tests/test_bundle.py pins the result.
[project]
name = "cfb"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cfb-db",
    "cfb-api",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
    "pyright>=1.1.405",
    "uvicorn>=0.37",
    "httpx2>=2.13",
    "moto[s3]>=5.2.4",
    # The engine and its ingest stack (pyarrow, boto3). Here, not in [project]: Vercel installs the
    # API from this lock with --no-dev, and these would push it to a failing runtime install (D-114)
    # or grow every deployment's copy (D-126). The jobs run the engine with the dev group.
    "cfb-engine[train]",
]
# python/notebooks/ (marimo, D-121): `uv run --group notebooks marimo edit notebooks/01-explore.py`.
# Never a default group, and never the API's.
notebooks = [
    "marimo>=0.25.2",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["db", "engine", "api"]

[tool.uv.sources]
cfb-db = { workspace = true }
cfb-api = { workspace = true }
cfb-engine = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# A marimo cell displays its last bare expression.
"notebooks/*.py" = ["B018"]

[tool.ruff.lint.isort]
known-first-party = ["db", "engine", "api"]

[tool.pyright]
include = ["db/src", "db/tests", "db/migrations", "engine/src", "engine/tests", "api/src", "api/tests"]
exclude = ["**/.claude", "**/.venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["db/tests", "engine/tests", "api/tests"]
addopts = "-q"
norecursedirs = [".claude", ".venv"]
