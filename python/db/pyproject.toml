[project]
name = "cfb-db"
version = "0.0.0"
description = "Serving-DB schema: SQLAlchemy models, Alembic migrations, views, and the URL guards"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sqlalchemy>=2.0.43",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "python-dotenv>=1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "db"
