# OPTIONAL: Claude reviews each PR once it leaves draft (it skips drafts).
# In the kit's flow, /implement-task opens a draft PR, waits for CI, then marks it ready, which triggers this.
# Setup: run /install-github-app in Claude Code (attached terminal) and choose the subscription token,
# or add a CLAUDE_CODE_OAUTH_TOKEN secret (generate with `claude setup-token`).
name: Claude PR review

on:
  pull_request:
    types: [ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
