# The lines job (TASK-022, docs/02-architecture.md › Components › 4 Jobs): daily at 08:00 ET,
# plus Thursday and Friday at 19:00 ET (the pick window), a snapshot of CFBD's lines for the next
# week's games, published to production:
#
#   pull the earliest week with a game not yet kicked off (/games and /lines) into the R2 lake
#   → stage the season in a scratch lake on the runner → data-quality checks → publish in one
#   transaction
#
# A failed check ends the run before production is opened, so nothing partial is published. The
# dispatcher (infra/dispatcher, D-122) starts it on time with workflow_dispatch; the crons below
# are late fallbacks that do nothing if a dispatched run succeeded since 3 hours before the
# cron's own slot (D-129). The logic
# lives in `engine job lines` (python/engine/src/engine/jobs.py); README › Jobs says how to read a
# failed run. Secrets reach steps only through `env:`.
name: Lines

on:
  workflow_dispatch:
    inputs:
      fallback_cron:
        description: "Try the fallback: take the late-fallback path as if this cron had fired (e.g. the schedule below). Empty: always run"
        required: false
        default: ""
  schedule:
    # Fallback for the dispatcher's daily 08:00 ET: 14:00 UTC is 10:00 ET in EDT, 09:00 ET in EST
    - cron: "0 14 * * *"
    # Fallback for its Thu and Fri 19:00 ET: Fri and Sat 01:00 UTC is 21:00 ET in EDT, 20:00 ET in EST
    - cron: "0 1 * * 5,6"

# One publish to production at a time, shared with results.yml; a queued run never cancels one
# half done. It also keeps the lake to one writer (D-112).
concurrency:
  group: lake-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the fallback's check for a dispatched run

env:
  UV_FROZEN: "1"

jobs:
  lines:
    name: lines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Skip the fallback if the dispatcher's run succeeded
        id: guard
        uses: ./.github/actions/skip-if-dispatched

      # `uv run` installs the dev group, which holds the engine's pyarrow, boto3 and duckdb (D-114).
      - name: Pull, stage, check and publish to production
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env:
          LIVE: "true"
          LAKE_URI: ${{ vars.LAKE_URI }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_DATA_LAKE_ACCESS_KEY_ID: ${{ secrets.R2_DATA_LAKE_ACCESS_KEY_ID }}
          R2_DATA_LAKE_SECRET_ACCESS_KEY: ${{ secrets.R2_DATA_LAKE_SECRET_ACCESS_KEY }}
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PRODUCTION_DATABASE_URL_UNPOOLED: ${{ secrets.PRODUCTION_DATABASE_URL_UNPOOLED }}
        run: uv --directory python run engine job lines --target live --summary "$GITHUB_STEP_SUMMARY"
