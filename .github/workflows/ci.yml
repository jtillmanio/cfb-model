# CI gate for every PR and every push to the base branch.
# /customize-kit replaces the "not configured" step with this stack's setup and checks.
# Keep the job name "verify": branch protection requires it by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # ---- Throwaway database (uncomment if the app has one) ----------------
    # services:
    #   postgres:
    #     image: postgres:16
    #     env:
    #       POSTGRES_USER: ci
    #       POSTGRES_PASSWORD: ci
    #       POSTGRES_DB: app_ci
    #     ports: ["5432:5432"]
    #     options: >-
    #       --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    # env:
    #   DATABASE_URL: postgres://ci:ci@localhost:5432/app_ci

    steps:
      - uses: actions/checkout@v6

      - name: Task files parse cleanly
        shell: pwsh
        run: ./.claude/scripts/build-index.ps1

      # ---- Stack setup and checks (filled by /customize-kit) ---------------
      - name: CI not configured
        run: |
          echo "::error::CI is not configured for this stack yet. Run /customize-kit in Claude Code."
          exit 1

      # Node example:
      # - uses: actions/setup-node@v4
      #   with: { node-version-file: ".nvmrc", cache: "npm" }
