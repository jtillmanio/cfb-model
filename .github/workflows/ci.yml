# CI gate for every PR and every push to the base branch.
# The job name must match workflow.ciJobName in .claude/kit.json (default "verify"):
# branch protection and /implement-task's ready gates require it by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Tests, the fixture seed and e2e read only this (the test-DB guard). No DATABASE_URL in CI.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/cfb_test
      # The e2e API's port (web/playwright.config.ts). next.config bakes the /api/py rewrite at
      # build time, so the build step needs it too, not only test:e2e.
      API_URL: http://127.0.0.1:8001
      # Test-only key for the API's JWT (TASK-003): the web servers sign with it, the API verifies
      # it (TASK-004). Must equal TEST_API_JWT_SECRET in web/e2e/test-env.ts, which e2e passes to
      # its servers; pytest reads it from here. Not a secret: Vercel holds the real ones.
      API_JWT_SECRET: e2e-only-api-jwt-secret-never-used-outside-tests-0001
      UV_FROZEN: "1"

    steps:
      # Full history: the merged-migration check diffs against the merge base with main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Task files parse cleanly
        shell: pwsh
        run: ./.claude/scripts/build-index.ps1

      # Sets PG_MAJOR, the one value CI and the backup share (D-109), and starts postgres:PG_MAJOR
      # with a registry fallback. A step, not `services:`, because a service image can't read env.
      - name: Start Postgres
        uses: ./.github/actions/start-postgres
        with:
          database: cfb_test

      # setup-uv publishes exact version tags only (no floating major).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory python sync
          pnpm --dir web exec playwright install --with-deps chromium

      # Migrations are forward-only (D-020): fail if one already on main was edited, renamed or
      # deleted. A PR diffs from its merge base with the base branch; a push to main from the
      # previous tip of main.
      - name: Merged migrations unchanged
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: uv --directory python run python -m db merged-migrations --base "$BASE"

      - name: Migrate the test DB
        run: pnpm db:migrate:test
      - name: Migration checks (one head, models match migrations)
        run: pnpm db:check
      - name: Seed the fixture
        run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
