# CI gate for every PR and every push to the base branch.
# Keep the job name "verify": branch protection requires it by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Set once, here (D-017, D-099); the backup workflow reads the same value when it lands.
      # Postgres starts in a step, not `services:`, because a service image can't read `env`.
      PG_MAJOR: "18"
      # Tests, the fixture seed and e2e read only this (the test-DB guard). No DATABASE_URL in CI.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/cfb_test
      # The e2e API's port (web/playwright.config.ts). next.config bakes the /api/py rewrite at
      # build time, so the build step needs it too, not only test:e2e.
      API_URL: http://127.0.0.1:8001
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Task files parse cleanly
        shell: pwsh
        run: ./.claude/scripts/build-index.ps1

      # The official image through AWS's public mirror: anonymous Docker Hub pulls from shared
      # runner IPs hit its rate limit ("toomanyrequests") and fail the job before any test runs.
      - name: Start Postgres ${{ env.PG_MAJOR }}
        run: |
          docker run -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=cfb_test \
            "public.ecr.aws/docker/library/postgres:${PG_MAJOR}"
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U ci -d cfb_test && exit 0
            sleep 2
          done
          docker logs pg
          exit 1

      # setup-uv publishes exact version tags only (no floating major).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory python sync
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Migrate the test DB
        run: pnpm db:migrate:test
      - name: Migration checks (one head, models match migrations)
        run: pnpm db:check
      - name: Seed the fixture
        run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
