# CI gate for every PR and every push to the base branch.
# Keep the job name "verify": branch protection requires it by name.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PG_MAJOR is set once, here (D-017, D-099). A service image can't read `env`, so it's a
    # one-value matrix; the backup workflow reads the same value when it lands.
    strategy:
      matrix:
        pg_major: ["18"]

    services:
      postgres:
        image: postgres:${{ matrix.pg_major }}
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cfb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PG_MAJOR: ${{ matrix.pg_major }}
      # Tests, the fixture seed and e2e read only this (the test-DB guard). No DATABASE_URL in CI.
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/cfb_test
      UV_FROZEN: "1"

    steps:
      - uses: actions/checkout@v7

      - name: Task files parse cleanly
        shell: pwsh
        run: ./.claude/scripts/build-index.ps1

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          uv --directory python sync
          pnpm --dir web exec playwright install --with-deps chromium

      - name: Migrate the test DB
        run: pnpm db:migrate:test
      - name: Migration checks (one head, models match migrations)
        run: pnpm db:check
      - name: Seed the fixture
        run: pnpm db:seed

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore
