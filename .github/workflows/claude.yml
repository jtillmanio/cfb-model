# OPTIONAL (Level 3): mention @claude in an issue or PR comment and Claude works on it in GitHub Actions.
# Best for small fixes sent from your phone. Point it at a task file, for example:
#   @claude implement docs/tasks/TASK-021-fix-date-format.md following .claude/skills/implement-task/SKILL.md in unattended mode
# The kit's hooks are Windows PowerShell scripts and won't run on the Linux runner; CI covers verification instead.
# Same secret setup as claude-pr-review.yml.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 60"
