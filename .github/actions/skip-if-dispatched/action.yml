# The dispatcher (infra/dispatcher, D-122) starts each scheduled workflow on time with a
# workflow_dispatch; the workflow's own `schedule` cron is only a late fallback for when the
# dispatcher didn't. This says whether a run is that fallback with nothing to do: a `schedule` run
# when a dispatched run of the same workflow succeeded at or after 3 hours before the cron's own
# slot (D-129). Anchoring to the slot, not to when the run started, keeps GitHub's 5-8 hour late
# starts from moving the window. Every other run (dispatched, or a schedule run with no such
# success) goes ahead. A dispatch with `fallback_cron` set takes the fallback path as if that cron
# had fired, to try both paths on a branch.
#
# The logic is `engine fallback` (python/engine/src/engine/fallback.py), so the calling job must
# run `astral-sh/setup-uv` first and needs `permissions: actions: read` for `gh run list`.
name: Skip if dispatched
description: Output skip=true for a schedule run when a workflow_dispatch run succeeded since 3 hours before its cron slot

outputs:
  skip:
    description: '"true" when this run should do nothing'
    value: ${{ steps.check.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Did the dispatcher's run for this slot succeed?
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        SCHEDULE: ${{ github.event.schedule || github.event.inputs.fallback_cron }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
      run: |
        # owner/repo/.github/workflows/<file>@<ref> -> <file>
        workflow="${WORKFLOW_REF%@*}"
        workflow="${workflow##*/}"
        uv --directory python run engine fallback --event "$EVENT" --schedule "$SCHEDULE" \
          --workflow "$workflow" --summary "$GITHUB_STEP_SUMMARY"
